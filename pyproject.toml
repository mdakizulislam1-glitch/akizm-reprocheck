[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akizm-reproflight"
version = "0.1.0"
description = "A local-first Python research code reproducibility pre-flight tool."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AKIZ M" }]
dependencies = []

[project.scripts]
reproflight = "reproflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
